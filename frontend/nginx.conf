server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 101m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /uploads/ {
        proxy_pass $backend;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}